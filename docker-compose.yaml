# Full-stack local deployment: `docker compose up --build`, then open
# http://localhost:5173. The browser talks to the Vite dev server, which
# proxies /api to the backend container, so it is same-origin (no CORS setup).
services:
  backend:
    build: .
    environment:
      PORT: "8000"                 # Dockerfile CMD binds this; matches the proxy below
      NETFLUX_MAX_DESIGN_JOBS: "2" # keep concurrency modest for local machines
    ports:
      - "8000:8000"                # exposed for direct access to /api/v1/docs

  frontend:
    image: node:20-slim
    working_dir: /app
    environment:
      NETFLUX_API: "http://backend:8000"  # vite.config.ts reads this for the /api proxy
    volumes:
      - ./netflux-ui:/app
      - frontend_node_modules:/app/node_modules  # keep container deps off the host mount
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
